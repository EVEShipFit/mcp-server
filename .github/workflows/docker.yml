name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: mcp-server:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Smoke test
        run: |
          docker run -d --name open -p 8080:8080 -e NO_LOGIN=true mcp-server:test
          docker run -d --name login -p 8081:8080 \
            -e PUBLIC_URL=https://mcp.example.com \
            -e EVE_CLIENT_ID=smoke -e EVE_CLIENT_SECRET=smoke \
            -e SIGNING_KEY=a-signing-key-for-the-smoke-test-only \
            mcp-server:test
          for port in 8080 8081; do
            for i in $(seq 1 120); do curl -sf localhost:$port/healthz && break; sleep 1; done
          done

          fail() { echo "$1"; docker logs open; docker logs login; exit 1; }
          result=$(curl -sf localhost:8080/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "MCP-Protocol-Version: 2025-06-18" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"calculate_fit","arguments":{"fit":"[Rifter, smoke]\n200mm AutoCannon II, EMP S\n"}}}' \
            || true)
          echo "$result" | grep -q dps || fail "calculate_fit: $result"

          headers=$(curl -s -o /dev/null -D - localhost:8081/mcp -X POST)
          echo "$headers" | grep -q "^HTTP/1.1 401" || fail "no 401: $headers"
          echo "$headers" | grep -qi '^www-authenticate: Bearer resource_metadata="https://mcp.example.com/.well-known/oauth-protected-resource/mcp"' || fail "no challenge: $headers"
          curl -sf localhost:8081/.well-known/oauth-authorization-server | grep -q '"issuer":"https://mcp.example.com"' || fail "no metadata"

      - name: Lowercase image name
        if: github.event_name != 'pull_request'
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Push by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Save digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir digests && touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Publish amd64 and arm64 under one tag
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
