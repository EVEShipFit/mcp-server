[package]
name = "esf-mcp-server"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4.5", features = ["derive", "env"] }
esf-mcp = "15"
getrandom = "0.4.3"
hmac = "0.13.0"
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["cors"] }
ureq = "3.5.2"
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
